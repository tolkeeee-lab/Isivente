<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B36" />
      <stop offset="50%" stop-color="#3B236E" />
      <stop offset="100%" stop-color="#190F2E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C93" />
      <stop offset="100%" stop-color="#8B6FE0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF5C93" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#8B6FE0" stroke-opacity="0.3" stroke-width="4" />
  
  <!-- Isivente Symbol 'i' stylized with shopping bag / sparkle -->
  <g transform="translate(106, 86)" filter="url(#glow)">
    <!-- Main shopping bag outline -->
    <path d="M50 110 C50 85, 70 65, 95 65 L205 65 C230 65, 250 85, 250 110 L260 280 C260 305, 240 325, 215 325 L85 325 C60 325, 40 305, 40 280 Z" fill="url(#accentGrad)" />
    
    <!-- Bag Handle -->
    <path d="M105 65 C105 20, 195 20, 195 65" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
    
    <!-- Sparkle star on bag -->
    <path d="M150 150 L158 178 L186 186 L158 194 L150 222 L142 194 L114 186 L142 178 Z" fill="#FFFFFF" />
    
    <!-- Dots for 'i' branding -->
    <circle cx="230" cy="115" r="14" fill="#A8E6C9" />
  </g>
  
  <!-- Wordmark 'ISI' -->
  <text x="256" y="445" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="4">
    ISIVENTE
  </text>
</svg>
