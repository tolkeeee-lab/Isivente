<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Slide 1 - Carrousel Z3 Zoom</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 1080px; height: 1080px; overflow: hidden; background: #0b0d14; color: #fff; position: relative; }
    
    /* Background real product photo */
    .bg-img {
      position: absolute;
      top: 0; left: 0; width: 1080px; height: 1080px;
      object-fit: cover;
      object-position: center 20%;
      filter: brightness(0.92) contrast(1.06);
    }

    /* Gradient Overlays for readability and drama */
    .overlay-top {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 420px;
      background: linear-gradient(180deg, rgba(10,12,18,0.95) 0%, rgba(10,12,18,0.82) 50%, rgba(10,12,18,0) 100%);
      z-index: 2;
    }
    .overlay-bottom {
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 380px;
      background: linear-gradient(0deg, rgba(10,12,18,0.98) 0%, rgba(10,12,18,0.85) 60%, rgba(10,12,18,0) 100%);
      z-index: 2;
    }

    /* Content Layout */
    .content {
      position: absolute;
      top: 0; left: 0; width: 1080px; height: 1080px;
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 3;
    }

    /* Top Section : Hook */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(245, 158, 11, 0.15);
      border: 1.5px solid rgba(245, 158, 11, 0.5);
      color: #fbbf24;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 20px;
      width: fit-content;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.2);
    }
    .hook-title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.03em;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(0,0,0,0.8);
    }
    .hook-title span {
      background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Bottom Section : CTA & Features */
    .bottom-card {
      background: rgba(18, 22, 32, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 32px 36px;
      backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.15), 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .features-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .feature-item {
      font-size: 22px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .feature-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
    }
    .cta-btn {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0b0d14;
      font-size: 24px;
      font-weight: 900;
      padding: 20px 36px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      gap: 12px;
      border: none;
    }
  </style>
</head>
<body>
  <img src="images/stabilisateur-hero.jpg" class="bg-img" alt="WONEW Z3">
  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>

  <div class="content">
    <div>
      <div class="badge">🔥 Nouveauté 2026 • WONEW Z3 Zoom™</div>
      <h1 class="hook-title">Arrêtez de ruiner vos vidéos avec des <span>tremblements</span>.</h1>
    </div>

    <div class="bottom-card">
      <div class="features-list">
        <div class="feature-item"><span class="feature-dot"></span> Aimant MagSafe 20N ultra-puissant</div>
        <div class="feature-item"><span class="feature-dot"></span> Trépied + Télécommande 10m sans pile</div>
        <div class="feature-item" style="color:#fbbf24;"><span class="feature-dot" style="background:#fbbf24;box-shadow:0 0 12px #fbbf24;"></span> Paiement à la livraison partout au Bénin</div>
      </div>
      <div class="cta-btn">
        <span>Glisser ›</span>
      </div>
    </div>
  </div>
</body>
</html>
